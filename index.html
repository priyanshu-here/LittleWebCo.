<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem('lwc-theme')
          var t = s === 'dark' || s === 'light' ? s : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <title>Little Web Company — Digital Design & Development Studio</title>
    <meta
      name="description"
      content="Little Web Company is a digital web studio creating modern websites, UI/UX experiences, SEO-ready digital experiences and ongoing website care for businesses."
    />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Little Web Company" />
    <meta property="og:title" content="Little Web Company — Digital Design & Development Studio" />
    <meta
      property="og:description"
      content="A digital web studio creating modern websites, UI/UX experiences, SEO-ready digital experiences and ongoing website care for businesses."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
